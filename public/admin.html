<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0;url=/admin" />
    <title>YHA Computer | Admin</title>
  </head>
  <body>
    <p>Opening the React Admin Dashboard…</p>
    <script>
      (function () {
        var table = new URLSearchParams(window.location.search).get("table");
        var routes = { courses: "courses", subjects: "subjects", resources: "resources", sessions: "sessions", teachers: "teachers", course_teachers: "assignments", events: "events", reviews: "reviews", notifications: "notifications", enrollments: "enrollments", students: "students", student_password_resets: "password-help", contacts: "contacts" };
        var destination = routes[table] ? "/admin/" + routes[table] : "/admin";
        window.location.replace(destination);
      })();
    </script>
  </body>
</html>
